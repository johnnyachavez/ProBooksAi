# ProBooks+ai — default branch CI: static shell files, pytest (.[ci]), wheel build.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Path list: scripts/ci_validate_layout.sh (+ twin scripts/ci_validate_layout.ps1 for Windows).
      # Local: bash scripts/ci_validate_layout.sh (Git Bash / WSL / PATH) or .\scripts\ci_validate_layout.ps1 (PowerShell if bash missing).
      - name: Ensure documented files and entry points exist
        run: bash scripts/ci_validate_layout.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps for PySide6 (EGL/GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri

      - name: Install package and test deps
        run: pip install -e ".[ci]"

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Verify wheel build (Hatch packages)
        run: pip install build && python -m build --wheel -o /tmp/wheelhouse
