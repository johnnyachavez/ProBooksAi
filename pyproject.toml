[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probooks-ai"
version = "0.1.0"
description = "ProBooks+ai accounting core (SQLite + CLI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
probooks = "probooks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["probooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
